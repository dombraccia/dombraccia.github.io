<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Habit Tracker</title>
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Simple habit tracker">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css">
    
    <!-- Optional: Use icon from number_flash as placeholder if no new icon provided -->
    <link rel="apple-touch-icon" href="./icon-512.png">
</head>
<body>
    <div id="app">
        <div id="main-view" class="view">
            <div class="home-header">
                <h1>Habits</h1>
                <button id="btn-settings" class="icon-btn" aria-label="Settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
            
            <div class="card-wrapper">
                <button id="btn-prev" class="nav-arrow invisible">&lt;</button>
                <div id="card-container">
                </div>
                <button id="btn-next" class="nav-arrow invisible">&gt;</button>
            </div>

            <div id="session-controls" class="invisible">
                <button id="btn-no" class="btn-x" aria-label="No">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <button id="btn-yes" class="btn-check" aria-label="Yes">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
            </div>
            <div id="pagination-dots"></div>
        </div>

        <div id="create-view" class="view hidden" style="align-items: center; justify-content: center;">
            <div class="habit-card" style="justify-content: flex-start; padding-top: 40px; position: relative;">
                <button class="back-link" id="btn-back-create" style="position: absolute; top: 16px; left: 16px;">← Back</button>
                <h2>Create New Habit</h2>
                <div class="setup-group" style="width: 100%; margin-top: 20px;">
                    <label for="habit-name">Habit Name</label>
                    <input type="text" id="habit-name" placeholder="e.g. Read 10 pages">
                </div>
                <div class="actions" style="width: 100%; margin-top: auto; margin-bottom: 20px;">
                    <button id="btn-save-habit" class="primary" style="width: 100%;">Save Habit</button>
                </div>
            </div>
        </div>

        <div id="settings-view" class="view hidden">
            <button class="back-link" id="btn-back-settings">← Back</button>
            <h2>Settings</h2>
            <div class="settings-list">
                <div class="settings-item">
                    <div class="settings-item-info">
                        <div class="settings-item-title">Data Backup</div>
                        <div class="settings-item-desc">Export your habits to a file, or restore from a backup.</div>
                    </div>
                    <div class="settings-item-actions">
                        <button id="btn-export" class="secondary">Export JSON</button>
                        <input type="file" id="file-import" accept=".json" class="hidden">
                        <button id="btn-import-trigger" class="secondary">Import JSON</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./app.js"></script>
</body>
</html>
